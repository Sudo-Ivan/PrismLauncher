name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_KEY_ID: ${{ secrets.GPG_PRIVATE_KEY_ID }}

  create_release:
    name: Create release
    needs: build_release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          path: PrismLauncher-source
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Get version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mv PrismLauncher-source "PrismLauncher-$VERSION"

          appimage="$(find . -type f -name '*.AppImage' -print -quit)"
          appimage_zsync="$(find . -type f -name '*.AppImage.zsync' -print -quit)"
          portable="$(find . -type f -name 'PrismLauncher-portable.tar.gz' -print -quit)"
          flatpak="$(find . -type f -name '*.flatpak' -print -quit)"
          windows_zip="$(find . -type f -name 'PrismLauncher-Windows-MSVC-*.zip' ! -name '*Portable*' -print -quit)"
          windows_portable="$(find . -type f -name 'PrismLauncher-Windows-MSVC-Portable-*.zip' -print -quit)"
          windows_setup="$(find . -type f -name 'PrismLauncher-Setup.exe' -print -quit)"

          mv "$appimage" PrismLauncher-Linux-x86_64.AppImage
          mv "$appimage_zsync" PrismLauncher-Linux-x86_64.AppImage.zsync
          mv "$portable" PrismLauncher-Linux-x86_64-Portable.tar.gz
          mv "$flatpak" PrismLauncher-Linux-x86_64.flatpak
          mv "$windows_zip" "PrismLauncher-Windows-MSVC-$VERSION.zip"
          mv "$windows_portable" "PrismLauncher-Windows-MSVC-Portable-$VERSION.zip"
          mv "$windows_setup" "PrismLauncher-Windows-MSVC-Setup-$VERSION.exe"

          tar --exclude='.git' -czf "PrismLauncher-$VERSION.tar.gz" "PrismLauncher-$VERSION"

          rm -rf "PrismLauncher-$VERSION"
          find . -maxdepth 1 -type f -name 'PrismLauncher-*' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Compute SLSA subjects
        id: hashes
        run: |
          echo "hashes=$(grep -v 'SHA256SUMS' SHA256SUMS | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "Prism Launcher $VERSION" \
            --generate-notes \
            --latest \
            PrismLauncher-Linux-x86_64.AppImage \
            PrismLauncher-Linux-x86_64.AppImage.zsync \
            PrismLauncher-Linux-x86_64-Portable.tar.gz \
            PrismLauncher-Linux-x86_64.flatpak \
            "PrismLauncher-Windows-MSVC-$VERSION.zip" \
            "PrismLauncher-Windows-MSVC-Portable-$VERSION.zip" \
            "PrismLauncher-Windows-MSVC-Setup-$VERSION.exe" \
            "PrismLauncher-$VERSION.tar.gz" \
            SHA256SUMS

  slsa_provenance:
    name: SLSA provenance
    needs: create_release
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.create_release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.create_release.outputs.version }}
      draft-release: false
