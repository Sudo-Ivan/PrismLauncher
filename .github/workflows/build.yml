name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      environment:
        description: Deployment environment to run under
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: false
      GPG_PRIVATE_KEY_ID:
        required: false
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})

    environment: ${{ inputs.environment || '' }}

    permissions:
      contents: read
      # Required for build provenance attestations
      id-token: write
      attestations: write
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            qt-version: 6.11.2

          - os: windows-2022
            artifact-name: Windows-MSVC
            vcvars-arch: amd64
            qt-version: 6.11.2

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: custom
      BUILD_TYPE: ${{ inputs.build-type || 'Debug' }}
      CMAKE_PRESET: ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup dependencies
        id: setup-dependencies
        uses: $/.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      - name: Get version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: $/.github/actions/package/linux
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: $/.github/actions/package/windows
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

      - name: Attest build provenance (Linux)
        if: ${{ github.event_name != 'pull_request' && runner.os == 'Linux' }}
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4.2.2
        with:
          subject-path: |
            PrismLauncher-*.AppImage
            PrismLauncher-portable.tar.gz

      - name: Attest build provenance (Windows)
        if: ${{ github.event_name != 'pull_request' && runner.os == 'Windows' }}
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4.2.2
        with:
          subject-path: |
            PrismLauncher-Windows-MSVC-*.zip
            PrismLauncher-Setup.exe

  flatpak:
    name: Flatpak (x86_64)

    permissions:
      contents: read
      # Required for build provenance attestations
      id-token: write
      attestations: write

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Platform//6.10 org.kde.Sdk//6.10 org.freedesktop.Sdk.Extension.openjdk17//25.08

      - name: Build flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --default-branch=stable \
            --state-dir=/tmp/flatpak-state \
            --repo=/tmp/flatpak-repo \
            /tmp/flatpak-build \
            flatpak/org.prismlauncher.PrismLauncher.yml

      - name: Bundle flatpak
        run: |
          flatpak build-bundle /tmp/flatpak-repo PrismLauncher-Linux-x86_64.flatpak org.prismlauncher.PrismLauncher stable

      - name: Upload flatpak
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PrismLauncher-Linux-x86_64-flatpak
          path: PrismLauncher-Linux-x86_64.flatpak
          if-no-files-found: error

      - name: Attest flatpak provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4.2.2
        with:
          subject-path: PrismLauncher-Linux-x86_64.flatpak
