name: Package for Windows
description: Create a Windows package for Prism Launcher

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true

runs:
  using: composite

  steps:
    - name: Package (MSVC)
      shell: pwsh
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
        INPUTS_BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config $env:INPUTS_BUILD_TYPE

        cd ${{ github.workspace }}

        Get-ChildItem ${{ env.INSTALL_DIR }} -Recurse | ForEach FullName | Resolve-Path -Relative | %{ $_.TrimStart('.\') } | %{ $_.TrimStart('${{ env.INSTALL_DIR }}') } | %{ $_.TrimStart('\') } | Out-File -FilePath ${{ env.INSTALL_DIR }}/manifest.txt

    - name: Package (MSVC, portable)
      shell: pwsh
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
        INSTALL_PORTABLE_DIR: install-portable
        INPUTS_BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        cp -r ${{ env.INSTALL_DIR }} ${{ env.INSTALL_PORTABLE_DIR }}
        cmake --install ${{ env.BUILD_DIR }} --config $env:INPUTS_BUILD_TYPE --prefix ${{ env.INSTALL_PORTABLE_DIR }} --component portable

        Get-ChildItem ${{ env.INSTALL_PORTABLE_DIR }} -Recurse | ForEach FullName | Resolve-Path -Relative | %{ $_.TrimStart('.\') } | %{ $_.TrimStart('${{ env.INSTALL_PORTABLE_DIR }}') } | %{ $_.TrimStart('\') } | Out-File -FilePath ${{ env.INSTALL_PORTABLE_DIR }}/manifest.txt

    - name: Create archives
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: install
        INSTALL_PORTABLE_DIR: install-portable
        INPUTS_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        Compress-Archive -Path "${{ env.INSTALL_DIR }}\*" -DestinationPath "PrismLauncher-$env:INPUTS_ARTIFACT_NAME-$env:VERSION.zip"
        Compress-Archive -Path "${{ env.INSTALL_PORTABLE_DIR }}\*" -DestinationPath "PrismLauncher-$env:INPUTS_ARTIFACT_NAME-Portable-$env:VERSION.zip"

    - name: Package (installer)
      shell: pwsh
      env:
        BUILD_DIR: build
        INSTALL_DIR: install

        NSCURL_VERSION: "v24.9.26.122"
        NSCURL_SHA256: "AEE6C4BE3CB6455858E9C1EE4B3AFE0DB9960FA03FE99CCDEDC28390D57CCBB0"
      run: |
        New-Item -Name NSISPlugins -ItemType Directory
        Invoke-Webrequest https://github.com/negrutiu/nsis-nscurl/releases/download/"${{ env.NSCURL_VERSION }}"/NScurl.zip -OutFile NSISPlugins\NScurl.zip
        $nscurl_hash = Get-FileHash NSISPlugins\NScurl.zip -Algorithm Sha256 | Select-Object -ExpandProperty Hash
        if ( $nscurl_hash -ne "${{ env.NSCURL_SHA256 }}") {
          echo "::error:: NSCurl.zip sha256 mismatch"
          exit 1
        }
        Expand-Archive -Path NSISPlugins\NScurl.zip -DestinationPath NSISPlugins\NScurl

        cd ${{ env.INSTALL_DIR }}
        makensis -NOCD "${{ github.workspace }}/${{ env.BUILD_DIR }}/program_info/win_install.nsi"

    - name: Upload binary zip
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: PrismLauncher-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}
        path: PrismLauncher-${{ inputs.artifact-name }}-${{ inputs.version }}.zip
        if-no-files-found: error

    - name: Upload portable zip
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: PrismLauncher-${{ inputs.artifact-name }}-Portable-${{ inputs.version }}-${{ inputs.build-type }}
        path: PrismLauncher-${{ inputs.artifact-name }}-Portable-${{ inputs.version }}.zip
        if-no-files-found: error

    - name: Upload installer
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: PrismLauncher-${{ inputs.artifact-name }}-Setup-${{ inputs.version }}-${{ inputs.build-type }}
        path: PrismLauncher-Setup.exe
        if-no-files-found: error
