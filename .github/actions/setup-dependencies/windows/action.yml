name: Setup Windows Dependencies
description: Install and setup dependencies for building Prism Launcher

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  vcvars-arch:
    description: Visual Studio architecture to use
    required: true
    default: amd64

runs:
  using: composite

  steps:
    - name: Enter VS Developer shell
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ inputs.vcvars-arch }}

    - name: Setup Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: zulu
        java-version: 17

    - name: Setup vcpkg cache
      if: ${{ inputs.build-type == 'Debug' }}
      shell: pwsh
      env:
        USERNAME: ${{ github.repository_owner }}
        GITHUB_TOKEN: ${{ github.token }}
        FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      run: | # zizmor: ignore[github-env]
        .$(vcpkg fetch nuget) `
          sources add `
          -Source "$env:FEED_URL" `
          -StorePasswordInClearText `
          -Name GitHubPackages `
          -UserName "$env:USERNAME" `
          -Password "$env:GITHUB_TOKEN"
        .$(vcpkg fetch nuget) `
          setapikey "$env:GITHUB_TOKEN" `
          -Source "$env:FEED_URL"
        "VCPKG_BINARY_SOURCES=clear;nuget,$env:FEED_URL,readwrite" | Out-File -Append $env:GITHUB_ENV

    - name: Setup vcpkg environment
      shell: bash
      run: | # zizmor: ignore[github-env]
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
